<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remix Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/recherche" aria-label="Remix Finder, accueil">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      <span class="brand-name">Remix Finder</span>
    </a>
    <nav class="seg" aria-label="Sections">
      <a href="#/recherche" data-view="recherche">Recherche</a>
      <a href="#/idees" data-view="idees">Idées de mashup</a>
      <a href="#/tendances" data-view="tendances">Tendances</a>
    </nav>
  </div>
</header>

<main id="app" class="wrap"></main>

<div id="player" class="player" hidden>
  <div class="wrap player-inner">
    <img id="player-cover" alt="" width="48" height="48">
    <div class="player-text">
      <strong id="player-title"></strong>
      <span id="player-artist"></span>
    </div>
    <button id="player-toggle" class="icon-btn" aria-label="Pause"></button>
    <div class="player-progress" aria-hidden="true"><span id="player-bar"></span></div>
    <span id="player-time" class="muted small">0:00 / 0:30</span>
    <button id="player-close" class="icon-btn ghost" aria-label="Fermer le lecteur"></button>
  </div>
</div>
<audio id="audio" preload="none"></audio>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
